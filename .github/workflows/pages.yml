name: Pages

# Deploys the drag-a-GeoPackage demo (crates/kenro-wasm/demo) to GitHub
# Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2
        with:
          tool: wasm-pack
      - name: Build kenro-wasm
        run: wasm-pack build crates/kenro-wasm --target web --release --out-dir js/pkg -- --features full
      - name: Assemble site
        run: |
          mkdir -p _site/pkg _site/adapters
          cp crates/kenro-wasm/demo/index.html crates/kenro-wasm/demo/demo.mjs _site/
          cp crates/kenro-wasm/js/pkg/kenro_wasm.js crates/kenro-wasm/js/pkg/kenro_wasm_bg.wasm _site/pkg/
          cp crates/kenro-wasm/js/src/*.mjs _site/adapters/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
