# Builds the distributable artifacts and attaches them to a GitHub Release
# on every v* tag. Asset filenames are version-less on purpose so
# `releases/latest/download/<asset>` URLs stay stable (the release itself
# carries the version). workflow_dispatch runs the builds without
# publishing — a dry-run for the pipeline.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  ext:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: libkenro_ext.so
          - name: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            lib: libkenro_ext.so
          - name: macos-universal
            os: macos-latest
            lib: libkenro_ext.dylib
          - name: x86_64-pc-windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            lib: kenro_ext.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.name }}
      - name: Set up cross toolchain (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1
        with:
          target: ${{ matrix.target }}
      - name: Stub libsqlite3 for the cross linker (linux aarch64)
        # libsqlite3-sys emits `-lsqlite3` even in loadable_extension mode,
        # but no symbols are actually used (everything routes through
        # sqlite3_api_routines) and `--as-needed` drops the DT_NEEDED entry.
        # The cross sysroot has no aarch64 libsqlite3, so satisfy the flag
        # with an empty stub; the assert step below proves the artifact has
        # no runtime dependency on it.
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p /tmp/stublib
          echo 'void kenro_stub(void) {}' | aarch64-linux-gnu-gcc -shared -o /tmp/stublib/libsqlite3.so -x c -
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-L /tmp/stublib" >> "$GITHUB_ENV"

      - name: Build (single target)
        if: matrix.name != 'macos-universal'
        run: |
          rustup target add ${{ matrix.target }}
          cargo build -p kenro-ext --release --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.lib }} dist/
        shell: bash
      - name: Build (macOS universal)
        if: matrix.name == 'macos-universal'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build -p kenro-ext --release --target x86_64-apple-darwin
          cargo build -p kenro-ext --release --target aarch64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/${{ matrix.lib }} \
            target/x86_64-apple-darwin/release/${{ matrix.lib }} \
            target/aarch64-apple-darwin/release/${{ matrix.lib }}
          lipo -info dist/${{ matrix.lib }}

      - name: Assert no libsqlite3 runtime dependency (linux)
        if: contains(matrix.name, 'linux')
        run: |
          readelf -d dist/${{ matrix.lib }}
          ! readelf -d dist/${{ matrix.lib }} | grep -q 'NEEDED.*sqlite3'

      - name: Smoke-load through Python (native builds)
        if: matrix.name == 'x86_64-unknown-linux-gnu'
        run: |
          python3 - <<'EOF'
          import sqlite3
          con = sqlite3.connect(":memory:")
          con.enable_load_extension(True)
          con.load_extension("./dist/libkenro_ext")
          assert con.execute("SELECT ST_AsText(ST_GeomFromText('POINT(1 2)'))").fetchone()[0] == "POINT(1 2)"
          assert con.execute("SELECT ST_Area(ST_Buffer(ST_GeomFromText('POINT(0 0)'), 1.0)) > 3").fetchone()[0] == 1
          print("smoke OK (incl. overlay)")
          EOF

      - name: Package (tar.gz)
        if: matrix.os != 'windows-latest'
        # Members are listed explicitly (no `.`) so archives contain plain
        # `libkenro_ext.so` paths — Dockerfiles can extract single members.
        run: |
          cp LICENSE-MIT LICENSE-APACHE dist/
          tar czf kenro-ext-${{ matrix.name }}.tar.gz -C dist \
            ${{ matrix.lib }} LICENSE-MIT LICENSE-APACHE
      - name: Package (zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item LICENSE-MIT,LICENSE-APACHE dist/
          Compress-Archive -Path dist/* -DestinationPath kenro-ext-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kenro-ext-${{ matrix.name }}
          path: kenro-ext-${{ matrix.name }}.*
          if-no-files-found: error

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-wasm
      - name: Install wasm-pack
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: wasm-pack
      # Three tiers (sizes in docs/wasm.md); each bundle = pkg + adapters.
      - name: Build and package all tiers
        run: |
          cp LICENSE-MIT LICENSE-APACHE crates/kenro-wasm/js/
          build_tier() {
            local tier="$1"; shift
            wasm-pack build crates/kenro-wasm --target web --release --out-dir js/pkg -- "$@"
            tar czf "kenro-wasm-${tier}.tar.gz" -C crates/kenro-wasm/js \
              package.json pkg src LICENSE-MIT LICENSE-APACHE
          }
          build_tier minimal --no-default-features
          build_tier standard
          build_tier full --features full
          ls -la kenro-wasm-*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kenro-wasm
          path: kenro-wasm-*.tar.gz
          if-no-files-found: error

  release:
    needs: [ext, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS
      - name: Dry-run summary (workflow_dispatch)
        if: "!startsWith(github.ref, 'refs/tags/')"
        working-directory: assets
        run: |
          echo "workflow_dispatch dry run — assets built, no release published:"
          ls -la
          cat SHA256SUMS
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: assets/*
          generate_release_notes: true

  # Registry publishing runs only on tags, through approval-gated
  # environments, with OIDC trusted publishing — no long-lived tokens in
  # this repository. One-time registry-side setup (web UI):
  #   crates.io → kenro → Settings → Trusted Publishing → GitHub:
  #     repository reearth/kenro, workflow release.yml, environment crates-io
  #   npmjs.com → kenro-wasm → Settings → Trusted Publisher → GitHub Actions:
  #     organization/user reearth, repository kenro, workflow release.yml,
  #     environment npm
  publish-crate:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Tag must match the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print([p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='kenro'][0])")
          test "$tag" = "$version" || { echo "tag v$tag != Cargo.toml $version"; exit 1; }
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth
      - run: cargo publish -p kenro
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-wasm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5.1 (trusted publishing needs it)
        run: npm install -g npm@latest && npm --version
      - name: Tag must match the package version
        working-directory: crates/kenro-wasm/js
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          test "$tag" = "$version" || { echo "tag v$tag != package.json $version"; exit 1; }
      - name: Install wasm-pack
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: wasm-pack
      - name: Build (full tier)
        run: wasm-pack build crates/kenro-wasm --target web --release --out-dir js/pkg -- --features full
      - name: Publish (OIDC, provenance)
        working-directory: crates/kenro-wasm/js
        run: npm publish --access public
