name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build core without SQLite
        run: cargo build --no-default-features
      - name: Core must not depend on SQLite
        run: '! cargo tree --no-default-features -e normal | grep -q rusqlite'
      - name: Build with features off (stub fallbacks)
        run: cargo build --no-default-features --features rusqlite
      - name: Test (core only)
        run: cargo test --no-default-features
      - name: Test (default features)
        run: cargo test
      - name: Test (all features)
        run: cargo test --all-features
      - name: Golden MVT on the standard tier (rect-clip path, no overlay)
        run: cargo test --no-default-features --features rusqlite,mvt --test golden_mvt
      - name: Transform accuracy regression gate
        run: cargo run --example accuracy_report -- --check

  ext:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Each cargo call below MUST stay a separate invocation so the
      # loadable_extension and bundled feature graphs never unify (see the
      # [workspace] warning in Cargo.toml).
      - name: Clippy (kenro-ext)
        run: cargo clippy -p kenro-ext --all-targets -- -D warnings
      - name: Clippy (kenro-ext-test)
        run: cargo clippy -p kenro-ext-test --all-targets -- -D warnings
      - name: Build loadable extension
        run: cargo build -p kenro-ext --release
      - name: Load test through the built cdylib
        run: cargo test -p kenro-ext-test --release
        env:
          KENRO_EXT_REQUIRE: "1"
      - name: Python stdlib smoke (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 - <<'EOF'
          import sqlite3
          con = sqlite3.connect(":memory:")
          con.enable_load_extension(True)
          con.load_extension("./target/release/libkenro_ext")
          assert con.execute("SELECT ST_AsText(ST_GeomFromText('POINT(1 2)'))").fetchone()[0] == "POINT(1 2)"
          print("python load_extension OK")
          EOF

  wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          # 24, matching release.yml. `using` declarations (explicit resource
          # management) are a documented way to free a Prepared handle and are
          # exercised by test/prepared-scope.test.mjs; Node 22 rejects the
          # syntax outright, so that whole file failed to parse and took nine
          # tests with it.
          node-version: 24
      # Separate cargo invocations, per the workspace warning in Cargo.toml.
      # No --features: this is the standard tier. The full tier is covered by
      # the wasm-pack build below, and minimal gets its own line — the three
      # tiers docs/wasm.md quotes sizes for are the three that must compile.
      - name: Clippy (kenro-wasm, standard tier)
        run: cargo clippy -p kenro-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy (kenro-wasm, minimal tier)
        run: cargo clippy -p kenro-wasm --no-default-features --target wasm32-unknown-unknown -- -D warnings
      - name: Manifest consistency (rusqlite registration == manifest)
        run: cargo test --all-features --test manifest_consistency
      # The two hand-written wasm bindings drifted once: kenro-abi kept calling a
      # stale `accessors::st_coord_dim` that answered a constant 2, so ST_NDims
      # was wrong on every Go and Cloudflare host while rusqlite was right.
      - name: Binding parity (kenro-abi and kenro-wasm call the same functions)
        run: cargo test --all-features --test binding_parity
      # `has_zm: false` is how a function silently drops a Z; the guard keeps the
      # set of places allowed to write it enumerated and decided.
      - name: No silent 2D flatten
        run: cargo test --all-features --test no_silent_flatten
      # A "what kenro does not do" list is prose nothing compiles, so it rots.
      # This one rotted four times before the guard existed.
      - name: Docs do not claim a registered function is missing
        run: cargo test --all-features --test docs_not_stale
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build (wasm-pack, release, full)
        run: wasm-pack build crates/kenro-wasm --target web --release --out-dir js/pkg -- --features full
      - name: Size gate
        run: node crates/kenro-wasm/js/test/size-gate.mjs
      - name: Golden vectors + host smokes (Node)
        working-directory: crates/kenro-wasm/js
        run: |
          npm ci
          npm test
      # The index comparison in docs/wasm.md is generated, not hand-written;
      # this fails if either index drifts away from the documented numbers.
      - name: Spatial index comparison (docs regression gate)
        working-directory: crates/kenro-wasm/js
        run: npm run bench:check
      # The Cloudflare example is the only place `Prepared` and the spatial
      # indexes are exercised against a real host: workerd, real SQLite (D1
      # and Durable Object), the freshly built wasm.
      - name: Cloudflare example (workerd)
        working-directory: crates/kenro-wasm/cloudflare
        run: |
          npm ci
          npm test

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the staleness check diffs against the base commit
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go/go.sum
      # The embedded module is committed, so it can fall behind the sources it
      # was built from; a behavior-only change to the core would otherwise go
      # unnoticed until a user hit it.
      - name: Embedded wasm module is not stale
        run: |
          base="${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}"
          scripts/check-go-wasm-fresh.sh "$base"
      # Separate cargo invocations, per the workspace warning in Cargo.toml.
      - name: Clippy (kenro-abi, wasm target)
        run: cargo clippy -p kenro-abi --features full --target wasm32-wasip1 -- -D warnings
      # The tiers below `full` had rotted unnoticed: kenro-abi did not compile
      # at all without `overlay` (a step function outlived its cfg-gated enum
      # variant). Only `full` is shipped, so a compile check is the right depth
      # here — the runtime half of the gate is the tier matrix at the end.
      - name: Clippy (kenro-abi, standard tier)
        run: cargo clippy -p kenro-abi --target wasm32-wasip1 -- -D warnings
      - name: Clippy (kenro-abi, minimal tier)
        run: cargo clippy -p kenro-abi --no-default-features --target wasm32-wasip1 -- -D warnings
      - name: Test (kenro-abi, native)
        run: cargo test -p kenro-abi --features full
      - name: Vet
        working-directory: go
        run: go vet ./...
      # First against the committed artifact: `go get` users get exactly this
      # module, and a stale one fails registration (the manifest names an
      # export the wasm does not have) or a smoke case. Byte-comparing a
      # rebuild would be flaky instead — rustc and binaryen versions move.
      - name: Test (committed wasm module)
        working-directory: go
        run: go test ./...
      - name: Rebuild the embedded wasm module
        run: scripts/build-go-wasm.sh full
      - name: Test (freshly built wasm module)
        working-directory: go
        run: go test ./...
      # A compile check cannot see a *missing export*: the cfg'd-out function
      # compiles fine, and the module only fails when something calls it. So
      # build the other two tiers the script offers and register against each.
      # TestEveryTierRegistersAndRuns uses only functions the manifest lists
      # unconditionally — the rest of the Go suite legitimately sees stub
      # errors below `full`, which is why this is a filtered run.
      #
      # Runs last: it overwrites the committed artifact, and the steps above
      # need that artifact intact.
      - name: Non-full tiers register and run
        run: |
          for tier in minimal standard; do
            echo "::group::$tier tier"
            scripts/build-go-wasm.sh "$tier"
            (cd go && go test -run TestEveryTierRegistersAndRuns ./...)
            echo "::endgroup::"
          done
